<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" shape-rendering="crispEdges" role="img" aria-label="Retro 95">
	<!-- The theme previewing itself: teal desk, one window, the taskbar. -->
	<rect width="320" height="200" fill="#008080"/>

	<!-- Desktop icons -->
	<g>
		<rect x="14" y="12" width="18" height="14" fill="#c0c0c0"/>
		<rect x="16" y="14" width="14" height="9" fill="#000080"/>
		<rect x="18" y="27" width="10" height="3" fill="#c0c0c0"/>
		<rect x="12" y="34" width="22" height="5" fill="#ffffff"/>
		<rect x="14" y="52" width="18" height="15" fill="#ffff00"/>
		<rect x="14" y="49" width="8" height="4" fill="#ffff00"/>
		<rect x="12" y="73" width="22" height="5" fill="#ffffff"/>
	</g>

	<!-- Window: frame, title bar, controls, body -->
	<rect x="56" y="22" width="232" height="146" fill="#c0c0c0"/>
	<rect x="56" y="22" width="231" height="1" fill="#dfdfdf"/>
	<rect x="56" y="22" width="1" height="145" fill="#dfdfdf"/>
	<rect x="57" y="23" width="229" height="1" fill="#ffffff"/>
	<rect x="57" y="23" width="1" height="143" fill="#ffffff"/>
	<rect x="287" y="22" width="1" height="146" fill="#000000"/>
	<rect x="56" y="167" width="232" height="1" fill="#000000"/>
	<rect x="286" y="23" width="1" height="144" fill="#808080"/>
	<rect x="57" y="166" width="230" height="1" fill="#808080"/>
	<rect x="59" y="25" width="226" height="14" fill="#000080"/>
	<rect x="63" y="29" width="62" height="6" fill="#ffffff"/>
	<g fill="#c0c0c0">
		<rect x="245" y="27" width="12" height="10"/>
		<rect x="257" y="27" width="12" height="10"/>
		<rect x="271" y="27" width="12" height="10"/>
	</g>
	<g fill="#000000">
		<rect x="248" y="33" width="5" height="2"/>
		<rect x="260" y="29" width="7" height="6" fill="none" stroke="#000000" stroke-width="1"/>
		<rect x="274" y="29" width="6" height="6"/>
	</g>
	<rect x="61" y="44" width="222" height="118" fill="#ffffff"/>
	<rect x="61" y="44" width="222" height="1" fill="#808080"/>
	<rect x="61" y="44" width="1" height="118" fill="#808080"/>
	<g fill="#ffff00">
		<rect x="74" y="58" width="22" height="16"/>
		<rect x="114" y="58" width="22" height="16"/>
		<rect x="154" y="58" width="22" height="16"/>
	</g>
	<g fill="#000000">
		<rect x="72" y="80" width="26" height="3"/>
		<rect x="112" y="80" width="26" height="3"/>
		<rect x="152" y="80" width="26" height="3"/>
	</g>

	<!-- Taskbar -->
	<rect x="0" y="182" width="320" height="18" fill="#c0c0c0"/>
	<rect x="0" y="182" width="320" height="1" fill="#dfdfdf"/>
	<rect x="0" y="183" width="320" height="1" fill="#ffffff"/>
	<rect x="2" y="185" width="34" height="13" fill="#c0c0c0" stroke="#000000" stroke-width="1"/>
	<rect x="5" y="188" width="7" height="7" fill="#000080"/>
	<rect x="15" y="190" width="17" height="3" fill="#000000"/>
	<rect x="40" y="185" width="80" height="13" fill="#dfdfdf" stroke="#808080" stroke-width="1"/>
	<rect x="46" y="190" width="50" height="3" fill="#000000"/>
	<rect x="272" y="185" width="46" height="13" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
	<rect x="290" y="190" width="24" height="3" fill="#000000"/>
</svg>
